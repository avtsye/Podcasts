name: Podcast Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      history:
        description: "Download all episodes currently exposed by each RSS feed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: podcast-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("config/podcasts.json").read_text(encoding="utf-8"))
          required = ["GOOGLE_TOKEN_JSON", "GITHUB_TOKEN", "GITHUB_REPOSITORY"]
          missing = [name for name in required if not os.getenv(name)]

          if missing:
              raise SystemExit("Missing required values: " + ", ".join(missing))
          if not config.get("podcasts"):
              raise SystemExit("No podcasts configured.")

          print("Configuration validation passed.")
          PY

      - name: Monitor RSS feeds
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PODCAST_HISTORY_MODE: ${{ inputs.history || false }}
        run: python -m src.monitor

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update podcast monitor state"
            git push
          fi
