name: Podcast Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to download"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - all
      count:
        description: "Number of newest episodes per selected podcast (used in latest mode)"
        required: false
        default: "1"
        type: string
      podcasts:
        description: "Podcast IDs separated by commas. Leave empty to process all enabled podcasts."
        required: false
        default: ""
        type: string
  repository_dispatch:
    types:
      - podcast_manual
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.event_name == 'issues' && (startsWith(github.event.issue.title, '[מצב]') || startsWith(github.event.issue.title, '[רשימת פודקאסטים]')) && format('podcast-readonly-{0}', github.event.issue.number) || 'podcast-monitor' }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'issues' || github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YEMOS_TOKEN: ${{ secrets.YEMOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("config/podcasts.json").read_text(encoding="utf-8"))
          required = ["GOOGLE_TOKEN_JSON", "GITHUB_TOKEN", "GITHUB_REPOSITORY"]
          missing = [name for name in required if not os.getenv(name)]

          if missing:
              raise SystemExit("Missing required values: " + ", ".join(missing))
          if not config.get("podcasts"):
              raise SystemExit("No podcasts configured.")

          print(f"Configuration validation passed: {len(config['podcasts'])} podcasts configured.")
          PY

      - name: Parse Issues dashboard request
        id: parse_request
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python -m src.issue_dashboard

      - name: Mark request in progress
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⏳ הבקשה התקבלה והטיפול התחיל."

      - name: Manage podcast configuration
        if: github.event_name == 'issues' && steps.parse_request.outputs.kind == 'manage'
        env:
          ACTION: ${{ steps.parse_request.outputs.action }}
          CURRENT_NAME: ${{ steps.parse_request.outputs.current_name }}
          NAME: ${{ steps.parse_request.outputs.name }}
          RSS: ${{ steps.parse_request.outputs.rss }}
          DRIVE_FOLDER: ${{ steps.parse_request.outputs.drive_folder }}
          YEMOS_BRANCH: ${{ steps.parse_request.outputs.yemos_branch }}
        run: python -m src.manage_podcast

      - name: Report system status
        if: github.event_name == 'issues' && steps.parse_request.outputs.kind == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SCOPE: ${{ steps.parse_request.outputs.scope }}
        run: |
          python - <<'PY' > /tmp/status.md
          import json, os
          from pathlib import Path
          cfg=json.loads(Path("config/podcasts.json").read_text(encoding="utf-8"))
          st=json.loads(Path("data/state.json").read_text(encoding="utf-8")) if Path("data/state.json").exists() else {"feeds":{},"episodes":{}}
          feeds=st.get("feeds",{}); eps=st.get("episodes",{})
          errors=[(p["name"],feeds.get(p["id"],{}).get("last_error")) for p in cfg["podcasts"] if feeds.get(p["id"],{}).get("last_error")]
          print("## 📊 מצב המערכת\n")
          print(f"- פודקאסטים מוגדרים: **{len(cfg['podcasts'])}**")
          print(f"- פודקאסטים פעילים: **{sum(p.get('enabled',True) for p in cfg['podcasts'])}**")
          print(f"- פרקים במעקב: **{len(eps)}**")
          print(f"- פידים עם שגיאה אחרונה: **{len(errors)}**\n")
          if errors:
              print("### שגיאות אחרונות")
              for name,error in errors: print(f"- **{name}** — {error}")
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/status.md

      - name: Report podcast and Yemos branch list
        if: github.event_name == 'issues' && steps.parse_request.outputs.kind == 'podcast_list'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python -m src.podcast_list_report > /tmp/podcast-list.md
          {
            echo "# 📋 רשימת פודקאסטים, RSS ושלוחות Yemos"
            echo
            echo "עודכן אוטומטית מהריצה האחרונה."
            echo
            cat /tmp/podcast-list.md
          } > /tmp/podcast-list-dashboard.md
          gh issue edit 24 --body-file /tmp/podcast-list-dashboard.md
          gh issue comment "$ISSUE_NUMBER" --body "✅ הרשימה עודכנה ב-Issue הקבוע: #24"

      - name: Monitor RSS feeds
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YEMOS_TOKEN: ${{ secrets.YEMOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PODCAST_HISTORY_MODE: ${{ github.event_name == 'schedule' && 'false' || github.event_name == 'issues' && (steps.parse_request.outputs.kind == 'redownload' || steps.parse_request.outputs.mode == 'all') || github.event_name == 'workflow_dispatch' && inputs.mode == 'all' || github.event.client_payload.mode == 'all' }}
          PODCAST_COUNT: ${{ github.event_name == 'schedule' && '0' || github.event_name == 'issues' && steps.parse_request.outputs.count || github.event_name == 'workflow_dispatch' && inputs.count || github.event.client_payload.count }}
          PODCAST_IDS: ${{ github.event_name == 'schedule' && '' || github.event_name == 'issues' && steps.parse_request.outputs.ids || github.event_name == 'workflow_dispatch' && inputs.podcasts || github.event.client_payload.podcasts }}
          PODCAST_FORCE_EPISODES: ${{ github.event_name == 'issues' && steps.parse_request.outputs.episodes || '[]' }}
          PODCAST_FORCE_COUNT: ${{ github.event_name == 'issues' && steps.parse_request.outputs.force_count || '0' }}
          PODCAST_FORCE_TARGETS: ${{ github.event_name == 'issues' && steps.parse_request.outputs.targets || '' }}
        if: github.event_name != 'issues' || steps.parse_request.outputs.kind == 'download' || steps.parse_request.outputs.kind == 'redownload'
        run: python -m src.monitor

      - name: Notify Yemos about new podcast uploads
        if: success() && (github.event_name != 'issues' || steps.parse_request.outputs.kind == 'download' || steps.parse_request.outputs.kind == 'redownload')
        env:
          YEMOS_TOKEN: ${{ secrets.YEMOS_TOKEN }}
        run: python -m src.yemos_run_report

      - name: Record run history
        if: always() && (github.event_name != 'issues' || steps.parse_request.outputs.kind == 'download' || steps.parse_request.outputs.kind == 'redownload' || steps.parse_request.outputs.kind == 'manage')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: python -m src.run_history

      - name: Log scheduled run in activity issue
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "20"
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/scheduled-run.md
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          state_path = Path("data/state.json")
          cfg_path = Path("config/podcasts.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          cfg = json.loads(cfg_path.read_text(encoding="utf-8")) if cfg_path.exists() else {"podcasts":[]}
          feeds = state.get("feeds", {})
          episodes = state.get("episodes", {})
          active = [p for p in cfg.get("podcasts", []) if p.get("enabled", True)]
          errors = [(p.get("name",p.get("id","")), feeds.get(p.get("id",""),{}).get("last_error")) for p in active]
          errors = [(n,e) for n,e in errors if e]
          now = datetime.now(timezone.utc).astimezone(ZoneInfo("Asia/Jerusalem")).strftime("%d/%m/%Y %H:%M")
          status = "✅ הסתיימה בהצלחה" if os.environ.get("JOB_STATUS") == "success" else "❌ הסתיימה עם שגיאה"
          print(f"### {status} — {now}\n")
          print(f"- פודקאסטים פעילים: **{len(active)}**")
          print(f"- פרקים במצב המעקב: **{len(episodes)}**")
          print(f"- פידים עם שגיאה אחרונה: **{len(errors)}**")
          if errors:
              print("\n**שגיאות:**")
              for name,error in errors[:10]:
                  print(f"- {name}: {error}")
          print(f"\n[פתיחת הריצה ב-Actions]({os.environ['RUN_URL']})")
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/scheduled-run.md

      - name: Log temporary run in dedicated issue
        if: always() && github.event_name != 'schedule' && (github.event_name != 'issues' || steps.parse_request.outputs.kind == 'download' || steps.parse_request.outputs.kind == 'redownload')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ github.event_name == 'issues' && steps.parse_request.outputs.mode || github.event_name == 'workflow_dispatch' && inputs.mode || github.event.client_payload.mode || 'latest' }}
          COUNT: ${{ github.event_name == 'issues' && steps.parse_request.outputs.count || github.event_name == 'workflow_dispatch' && inputs.count || github.event.client_payload.count || '1' }}
          PODCASTS: ${{ github.event_name == 'issues' && steps.parse_request.outputs.ids || github.event_name == 'workflow_dispatch' && inputs.podcasts || github.event.client_payload.podcasts || 'all enabled' }}
        run: python -m src.log_manual_run
      - name: Comment on failed manual request
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ הבקשה לא הסתיימה בהצלחה. ה-Issue נשאר פתוח לבדיקה. [פתיחת הריצה ב-Actions]($RUN_URL)"

      - name: Comment on manual request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ הטיפול בבקשה הסתיים. ניתן לראות את פרטי הריצה בלשונית Actions."

      - name: Close manual request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER"

      - name: Save monitoring state
        if: always() && (github.event_name != 'issues' || steps.parse_request.outputs.kind == 'download' || steps.parse_request.outputs.kind == 'redownload' || steps.parse_request.outputs.kind == 'manage')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The Yemos state file may not exist when a run stops before the
          # first Yemos state save. Keep the commit step robust in that case.
          if [ ! -f data/state.json ]; then
            mkdir -p data
            printf '%s\n' '{"feeds": {}, "episodes": {}}' > data/state.json
          fi

          if [ ! -f data/yemos_state.json ]; then
            mkdir -p data
            printf '%s\n' '{"episodes": {}}' > data/yemos_state.json
          fi

          git add data/state.json data/yemos_state.json config/podcasts.json data/run_history.json docs/run-history.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update podcast monitor state"
            git pull --rebase origin main
            git push
          fi
