name: Full History Batch

on:
  workflow_call:
    inputs:
      podcast_id:
        required: true
        type: string
      podcast_name:
        required: true
        type: string
      offset:
        required: true
        type: number
      count:
        required: true
        type: number

permissions:
  contents: write

concurrency:
  group: podcast-state-writer
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Sync latest state
        run: git pull --ff-only origin main
      - name: Upload history batch
        id: monitor
        continue-on-error: true
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YEMOS_TOKEN: ${{ secrets.YEMOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PODCAST_HISTORY_MODE: "true"
          PODCAST_IDS: ${{ inputs.podcast_id }}
          PODCAST_BATCH_COUNT: ${{ inputs.count }}
          PODCAST_BATCH_OFFSET: ${{ inputs.offset }}
          PODCAST_MISSING_ONLY: "true"
          PODCAST_FORCE_COUNT: "0"
          PODCAST_FORCE_OFFSET: "0"
          PODCAST_FORCE_TARGETS: ""
          PODCAST_FORCE_EPISODES: "[]"
        run: python -m src.monitor
      - name: Save batch state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/yemos_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: save full-history batch ${{ inputs.podcast_id }} ${{ inputs.offset }}"
            git pull --rebase origin main
            git push
          fi
      - name: Batch summary
        if: always()
        run: |
          echo "### ${{ inputs.podcast_name }} — offset ${{ inputs.offset }}, count ${{ inputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.monitor.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail batch if monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
