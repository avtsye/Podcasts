name: Full History Upload

on:
  workflow_dispatch:
    inputs:
      podcasts:
        description: "Podcast IDs separated by commas; empty = all enabled"
        required: false
        default: ""
      targets:
        description: "Upload targets"
        required: true
        default: "Drive וגם Yemos"
        type: choice
        options:
          - "Drive וגם Yemos"
          - "Drive בלבד"
          - "Yemos בלבד"
      batch_size:
        description: "Episodes per batch"
        required: true
        default: "100"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: podcast-state-writer
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[היסטוריה מלאה]'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      targets: ${{ steps.params.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Resolve request parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PODCASTS: ${{ inputs.podcasts }}
          INPUT_TARGETS: ${{ inputs.targets }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re
          out=os.environ["GITHUB_OUTPUT"]
          if os.environ.get("EVENT_NAME") == "issues":
              body=os.environ.get("ISSUE_BODY","")
              ids=re.search(r"(?m)^PODCAST_IDS=(.*)$",body)
              targets=re.search(r"(?m)^TARGETS=(.*)$",body)
              podcast_ids=(ids.group(1).strip() if ids else "")
              target_value=(targets.group(1).strip() if targets else "Drive וגם Yemos")
          else:
              podcast_ids=os.environ.get("INPUT_PODCASTS","").strip()
              target_value=os.environ.get("INPUT_TARGETS","Drive וגם Yemos").strip()
          with open(out,"a",encoding="utf-8") as f:
              f.write("podcasts="+podcast_ids+"\n")
              f.write("targets="+target_value+"\n")
          PY
      - name: Build chunk matrix
        id: matrix
        env:
          PODCAST_IDS: ${{ steps.params.outputs.podcasts }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import feedparser
          cfg=json.loads(Path("config/podcasts.json").read_text(encoding="utf-8"))
          requested={x.strip() for x in os.getenv("PODCAST_IDS","").split(",") if x.strip()}
          size=max(10,min(250,int(os.getenv("BATCH_SIZE","100") or "100")))
          items=[]
          for p in cfg.get("podcasts",[]):
              if not p.get("enabled",True):
                  continue
              if requested and p.get("id") not in requested:
                  continue
              feed=feedparser.parse(p["rss"])
              count=len(feed.entries)
              for offset in range(0,count,size):
                  items.append({"id":p["id"],"name":p["name"],"offset":offset,"count":min(size,count-offset)})
          if not items:
              raise SystemExit("No upload batches were generated.")
          if len(items) > 256:
              raise SystemExit(f"Too many batches ({len(items)}); increase batch_size.")
          matrix=json.dumps({"include":items},ensure_ascii=False,separators=(",",":"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("matrix="+matrix+"\n")
          print(f"Prepared {len(items)} batch(es).")
          PY

  upload:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Sync latest state
        run: git pull --ff-only origin main
      - name: Upload history batch
        id: monitor
        continue-on-error: true
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YEMOS_TOKEN: ${{ secrets.YEMOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PODCAST_HISTORY_MODE: "true"
          PODCAST_IDS: ${{ matrix.id }}
          PODCAST_FORCE_COUNT: ${{ matrix.count }}
          PODCAST_FORCE_OFFSET: ${{ matrix.offset }}
          PODCAST_FORCE_TARGETS: ${{ needs.prepare.outputs.targets }}
          PODCAST_FORCE_EPISODES: "[]"
        run: python -m src.monitor
      - name: Save batch state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/yemos_state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: save full-history batch ${{ matrix.id }} ${{ matrix.offset }}"
            git pull --rebase origin main
            git push
          fi
      - name: Batch summary
        if: always()
        run: |
          echo "### ${{ matrix.name }} — offset ${{ matrix.offset }}, count ${{ matrix.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ steps.monitor.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail batch if monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
