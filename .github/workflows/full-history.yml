name: Full History Upload

on:
  workflow_dispatch:
    inputs:
      podcasts:
        description: "Podcast IDs separated by commas; empty = all enabled"
        required: false
        default: ""
      targets:
        description: "Upload targets"
        required: true
        default: "Drive וגם Yemos"
        type: choice
        options:
          - "Drive וגם Yemos"
          - "Drive בלבד"
          - "Yemos בלבד"
      batch_size:
        description: "Episodes per batch"
        required: true
        default: "100"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write


jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[היסטוריה מלאה]'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      targets: ${{ steps.params.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Resolve request parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PODCASTS: ${{ inputs.podcasts }}
          INPUT_TARGETS: ${{ inputs.targets }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re
          out=os.environ["GITHUB_OUTPUT"]
          if os.environ.get("EVENT_NAME") == "issues":
              body=os.environ.get("ISSUE_BODY","")
              ids=re.search(r"(?m)^PODCAST_IDS=(.*)$",body)
              targets=re.search(r"(?m)^TARGETS=(.*)$",body)
              podcast_ids=(ids.group(1).strip() if ids else "")
              target_value=(targets.group(1).strip() if targets else "Drive וגם Yemos")
          else:
              podcast_ids=os.environ.get("INPUT_PODCASTS","").strip()
              target_value=os.environ.get("INPUT_TARGETS","Drive וגם Yemos").strip()
          with open(out,"a",encoding="utf-8") as f:
              f.write("podcasts="+podcast_ids+"\n")
              f.write("targets="+target_value+"\n")
          PY
      - name: Build chunk matrix
        id: matrix
        env:
          PODCAST_IDS: ${{ steps.params.outputs.podcasts }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import feedparser
          cfg=json.loads(Path("config/podcasts.json").read_text(encoding="utf-8"))
          requested={x.strip() for x in os.getenv("PODCAST_IDS","").split(",") if x.strip()}
          size=max(10,min(250,int(os.getenv("BATCH_SIZE","100") or "100")))
          items=[]
          for p in cfg.get("podcasts",[]):
              if not p.get("enabled",True):
                  continue
              if requested and p.get("id") not in requested:
                  continue
              feed=feedparser.parse(p["rss"])
              count=len(feed.entries)
              for offset in range(0,count,size):
                  items.append({"id":p["id"],"name":p["name"],"offset":offset,"count":min(size,count-offset)})
          if not items:
              raise SystemExit("No upload batches were generated.")
          if len(items) > 256:
              raise SystemExit(f"Too many batches ({len(items)}); increase batch_size.")
          matrix=json.dumps({"include":items},ensure_ascii=False,separators=(",",":"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("matrix="+matrix+"\n")
          print(f"Prepared {len(items)} batch(es).")
          PY

  upload:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/full-history-batch.yml
    with:
      podcast_id: ${{ matrix.id }}
      podcast_name: ${{ matrix.name }}
      offset: ${{ matrix.offset }}
      count: ${{ matrix.count }}
    secrets: inherit
