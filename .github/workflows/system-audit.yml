name: System Audit

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/system_audit.py"
      - "src/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/podcast-monitor.yml"
      - "config/podcasts.json"
      - "docs/episode-index.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run comprehensive read-only audit
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YEMOS_TOKEN: ${{ secrets.YEMOS_TOKEN }}
        run: python -m src.system_audit
