name: Refresh Episode Index

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    paths:
      - "config/podcasts.json"
      - "src/build_episode_index.py"

permissions:
  contents: write

concurrency:
  group: refresh-episode-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build episode index
        run: python -m src.build_episode_index
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/episode-index.json docs/status.json
          if git diff --cached --quiet; then
            echo "No episode index changes."
          else
            git commit -m "chore: refresh episode index"
            git pull --rebase origin main
            git push
          fi
