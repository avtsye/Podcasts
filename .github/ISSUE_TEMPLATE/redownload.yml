name: "🔁 הורדה חוזרת של פרקים"
description: "הורד והעלה מחדש פרק אחד או כמה פרקים"
title: "[הורדה חוזרת] "
labels: ["בקשה", "הורדה-חוזרת"]
body:
  - type: input
    id: podcast
    attributes:
      label: מזהה הפודקאסט
      description: "לדוגמה: geekonomy"
    validations: {required: true}
  - type: textarea
    id: episodes
    attributes:
      label: פרקים להורדה חוזרת
      description: "שם פרק מדויק בכל שורה. אפשר גם להדביק GUID של פרק."
    validations: {required: true}
  - type: dropdown
    id: targets
    attributes:
      label: יעד ההורדה החוזרת
      options:
        - Drive וגם Yemos
        - Drive בלבד
        - Yemos בלבד
    validations: {required: true}
  - type: checkboxes
    id: confirm
    attributes:
      label: אישור
      options:
        - label: "אני מאשר להחליף/להעלות מחדש את הפרקים שבחרתי"
          required: true
