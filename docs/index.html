<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>מרכז הפודקאסטים</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <h1>🎧 מרכז הפודקאסטים</h1>
      <p id="indexStatus" class="muted">טוען אינדקס...</p>
    </div>
    <div class="actions">
      <button class="secondary" id="themeBtn" type="button">🌙 מצב כהה</button>
      <button class="secondary" id="densityBtn" type="button">↕️ תצוגה קומפקטית</button>
      <button class="secondary" id="refreshDataBtn" type="button">🔄 רענן נתונים</button>
    </div>
  </header>

  <section class="grid stats" id="dashboardStats"></section>

  <nav class="tabs" aria-label="ניווט ראשי">
    <button class="tab active" data-tab="search">🔎 חיפוש והורדה</button>
    <button class="tab" data-tab="status">📊 מצב המערכת</button>
    <button class="tab" data-tab="runs">🕘 היסטוריית ריצות</button>
    <button class="tab" data-tab="requests">📦 בקשות אחרונות</button>
  </nav>

  <section id="tab-search">
    <div class="card">
      <div class="controls controls-main">
        <input id="search" placeholder="חיפוש כותרת, פודקאסט, GUID או קישור" autocomplete="off">
        <select id="podcast" multiple size="4" aria-label="בחירת פודקאסטים" title="אפשר לבחור כמה פודקאסטים יחד"></select>
        <select id="category"><option value="all">כל הקטגוריות</option></select>
        <select id="sort">
          <option value="newest">חדש → ישן</option>
          <option value="oldest">ישן → חדש</option>
          <option value="az">א׳ → ת׳</option>
          <option value="podcast">לפי פודקאסט</option>
          <option value="status">לפי מצב העלאה</option>
        </select>
        <select id="statusFilter">
          <option value="all">כל המצבים</option>
          <option value="none">טרם הורד</option>
          <option value="drive">Drive בלבד</option>
          <option value="yemos">Yemos בלבד</option>
          <option value="both">Drive + Yemos</option>
          <option value="error">רק שגיאות</option>
        </select>
        <input id="dateFrom" type="date" aria-label="מתאריך">
        <input id="dateTo" type="date" aria-label="עד תאריך">
        <select id="defaultTarget">
          <option>Drive וגם Yemos</option>
          <option>Drive בלבד</option>
          <option>Yemos בלבד</option>
        </select>
      </div>

      <div class="toolbar">
        <button class="secondary quick-date" data-days="0">היום</button>
        <button class="secondary quick-date" data-days="7">7 ימים</button>
        <button class="secondary quick-date" data-days="30">30 יום</button>
        <button class="secondary quick-date" data-days="365">שנה</button>
        <button class="secondary" id="clearFiltersBtn">אפס סינון</button>
        <span class="spacer"></span>
        <label>אחרונים:
          <input id="latestCount" type="number" min="1" max="500" value="5" class="small-input">
        </label>
        <button class="secondary" id="selectLatestBtn">בחר N אחרונים</button>
      </div>

      <div class="toolbar">
        <button class="secondary" id="selectVisibleBtn">בחר את כל המוצגים</button>
        <button class="secondary" id="selectMissingDriveBtn">בחר חסרים ב־Drive</button>
        <button class="secondary" id="selectMissingYemosBtn">בחר חסרים ב־Yemos</button>
        <button class="secondary" id="selectMissingBothBtn">בחר כל מה שחסר</button>
        <button class="secondary" id="clearCartBtn">נקה סל</button>
        <button class="secondary" id="exportBtn">ייצוא תוצאות CSV</button>
      </div>

      <div id="podcastSummary" class="summary-strip"></div>
    </div>

    <div class="card">
      <div class="result-head">
        <div id="resultCount"></div>
        <div class="muted" id="renderNote"></div>
      </div>
      <div id="results"></div>
      <div class="load-more-wrap">
        <button id="loadMoreBtn" class="secondary hidden">טען עוד</button>
      </div>
    </div>

    <div class="cart" id="cartBox">
      <div class="cartbar">
        <div>
          <b id="cartCount">0 פרקים נבחרו</b>
          <span id="cartPodcasts" class="muted"></span>
        </div>
        <div class="actions">
          <button id="openCartBtn" class="secondary">פתח סל</button>
          <button id="previewBtn" disabled>תצוגה מקדימה</button>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-status" class="hidden">
    <div class="grid stats" id="statusCards"></div>
    <div class="card table-wrap"><table id="statusTable"></table></div>
  </section>

  <section id="tab-runs" class="hidden">
    <div class="card table-wrap"><table id="runsTable"></table></div>
  </section>

  <section id="tab-requests" class="hidden">
    <div class="card">
      <div class="actions">
        <button class="secondary" id="clearRequestHistoryBtn">נקה היסטוריה מקומית</button>
      </div>
      <div id="requestHistory"></div>
    </div>
  </section>
</main>

<dialog id="detailsDialog">
  <div class="dialog-body">
    <h2 id="detailTitle"></h2>
    <div id="detailBody"></div>
    <div class="actions footer-actions">
      <button class="secondary" id="copyEpisodeLinkBtn">העתק קישור לפרק</button>
      <button id="detailSelectBtn">הוסף לסל</button>
      <button class="secondary" data-close="detailsDialog">סגור</button>
    </div>
  </div>
</dialog>

<dialog id="cartDialog">
  <div class="dialog-body">
    <h2>🛒 סל הורדות</h2>
    <div id="cartDetails"></div>
    <div class="actions footer-actions">
      <button id="cartPreviewBtn">תצוגה מקדימה</button>
      <button class="secondary" data-close="cartDialog">סגור</button>
    </div>
  </div>
</dialog>

<dialog id="previewDialog">
  <div class="dialog-body">
    <h2>תצוגה מקדימה לפני שליחה</h2>
    <div id="previewBody"></div>
    <div id="largeRequestWarning" class="warning hidden"></div>
    <div class="actions footer-actions">
      <button id="confirmDownloadBtn">פתח בקשת הורדה ב־GitHub</button>
      <button class="secondary" data-close="previewDialog">חזור</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body>
</html>
